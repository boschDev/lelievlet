server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # the service worker and the pages are looked at again on every visit: a new deploy reaches the app at once
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # the model and the app manifest are not in nginx's own list of types (mime.types)
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # the rest (script, textures, icons) for a day; the service worker keeps the app's own copy
    location / {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }
}
