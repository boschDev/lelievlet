services:
  web:
    build: .
    restart: unless-stopped
    ports: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.lelievlet-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

      - "traefik.http.routers.lelievlet-https.entrypoints=websecure"
      - "traefik.http.routers.lelievlet-https.rule=Host(`lelievlet.roelandbos.ch`)"
      - "traefik.http.routers.lelievlet-https.tls.certresolver=http-resolver"

      - "traefik.http.routers.lelievlet-http.entrypoints=web"
      - "traefik.http.routers.lelievlet-http.rule=Host(`lelievlet.roelandbos.ch`)"
      - "traefik.http.routers.lelievlet-http.middlewares=https-redirect"
